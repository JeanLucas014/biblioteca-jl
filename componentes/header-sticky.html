<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

.wrap { max-width: 1360px; margin: 0 auto; }

header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(5,5,5,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 18px 40px;
}
header .inner { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.logo { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: #fff; }
.logo span { color: var(--accent); font-weight: 400; }

nav.desktop-nav { display: flex; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; }
nav.desktop-nav a {
  padding: 9px 16px; border-radius: 100px; border: 1px dashed transparent;
  color: #888; transition: all 0.3s ease; white-space: nowrap;
}
nav.desktop-nav a.active { border-color: var(--accent); color: #fff; }

.btn-contato { flex-shrink: 0; }

.menu-toggle {
  display: none; background: none; border: 1px solid var(--border-alt); border-radius: 6px;
  width: 40px; height: 40px; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
}
.menu-toggle svg { width: 20px; height: 20px; }

.mobile-nav {
  display: none; flex-direction: column; gap: 6px; padding: 16px 0 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.06em;
}
.mobile-nav a {
  padding: 12px 16px; border-radius: 8px; border: 1px dashed var(--border-alt); color: #999;
}
.mobile-nav a.active { border-color: var(--accent); color: #fff; }

@media (max-width: 860px) {
  header { padding: 16px 20px; }
  nav.desktop-nav { display: none; }
  .btn-contato { display: none; }
  .menu-toggle { display: flex; }
  body.menu-open .mobile-nav { display: flex; }
}
</style>
</head>
<body>
<header>
  <div class="inner wrap">
    <a href="#top" class="logo"><span>&lt;</span>JL<span>/&gt;</span></a>

    <nav class="desktop-nav" id="desktopNav">
      <a href="#top" data-section="top" class="active">Início</a>
      <a href="#portfolio" data-section="portfolio">Projetos</a>
      <a href="#servicos" data-section="servicos">Serviços</a>
      <a href="#sobre" data-section="sobre">Sobre</a>
      <a href="#faq" data-section="faq">Perguntas Frequentes</a>
      <a href="#contato" data-section="contato">Contato</a>
    </nav>

    <a href="#contato" class="amb-btn btn-contato">Iniciar Projeto</a>

    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <nav class="mobile-nav wrap" id="mobileNav">
    <a href="#top" data-section="top" class="active">Início</a>
    <a href="#portfolio" data-section="portfolio">Projetos</a>
    <a href="#servicos" data-section="servicos">Serviços</a>
    <a href="#sobre" data-section="sobre">Sobre</a>
    <a href="#faq" data-section="faq">Perguntas Frequentes</a>
    <a href="#contato" data-section="contato">Contato</a>
  </nav>
</header>
<script type="module">
export function initNav() {
  const navSections = ['top', 'portfolio', 'servicos', 'sobre', 'faq', 'contato'];
  const navLinks = document.querySelectorAll('[data-section]');

  function setActiveNav(id) {
    navLinks.forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-section') === id);
    });
  }

  // A seção que cruza a faixa central da tela é a ativa. Marcar pelo clique
  // erraria assim que a pessoa rolasse por conta própria.
  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) setActiveNav(e.target.id);
    });
  }, { rootMargin: '-45% 0px -45% 0px' });

  navSections.forEach(function (id) {
    const el = document.getElementById(id);
    if (el) observer.observe(el);
  });

  const menuToggle = document.getElementById('menuToggle');
  menuToggle.addEventListener('click', function () {
    document.body.classList.toggle('menu-open');
  });
  document.querySelectorAll('.mobile-nav a').forEach(function (a) {
    a.addEventListener('click', function () {
      document.body.classList.remove('menu-open');
    });
  });
}

initNav();
</script>
</body>
</html>
