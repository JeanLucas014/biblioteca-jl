<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-card: #1f1f1f;
  --border: #2a2a2a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --accent: #0ea5e9;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Uma cor por fonte de receita — a mesma em pílula, gráfico e avatar. */
  --src-empresa: #0ea5e9;
  --src-impressionart: #8b5cf6;
  --src-moto: #f59e0b;
  --src-mos: #22c55e;

  --fonte: 'Manrope', sans-serif;
  --fonte-titulo: 'Sora', sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg-base); color: var(--text); font-family: var(--fonte); }

/* Número em tabela, card ou badge nunca "dança" ao atualizar. */
.bs-num { font-variant-numeric: tabular-nums; }

.bs-segredos { width: min(460px, 100%); display: flex; flex-direction: column; gap: 10px; }

.bs-segredo { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-base); }
.bs-segredo-rotulo {
  margin-bottom: 6px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
}

.bs-segredo-linha { display: flex; align-items: center; gap: 10px; }

/* min-width: 0 no item flexível é o que permite truncar uma chave longa. */
.bs-segredo-valor {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--fonte-mono); font-size: 14px; color: var(--text);
}
/* Mascarado é outro texto, não o mesmo com fonte trocada: enquanto oculto, o
   valor real não está no DOM. */
.bs-oculto { letter-spacing: 0.15em; color: var(--text-muted); }

.bs-segredo-btn {
  display: grid; place-items: center; flex-shrink: 0;
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted);
}
.bs-segredo-btn:hover { color: var(--text); border-color: var(--accent); }
.bs-segredo-btn:disabled { opacity: 0.5; }
.bs-segredo-ic { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="bs-segredos">
  <div class="bs-segredo" data-rotulo="api">
    <div class="bs-segredo-rotulo">Chave da API</div>
    <div class="bs-segredo-linha">
      <div class="bs-segredo-valor bs-oculto bs-num">••••••••••••</div>
      <button type="button" class="bs-segredo-btn bs-segredo-olho" aria-label="Revelar"><svg class="bs-segredo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button type="button" class="bs-segredo-btn bs-segredo-copiar" aria-label="Copiar"><svg class="bs-segredo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    </div>
  </div>

  <div class="bs-segredo" data-rotulo="painel">
    <div class="bs-segredo-rotulo">Senha do painel</div>
    <div class="bs-segredo-linha">
      <div class="bs-segredo-valor bs-oculto bs-num">••••••••••••</div>
      <button type="button" class="bs-segredo-btn bs-segredo-olho" aria-label="Revelar"><svg class="bs-segredo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button type="button" class="bs-segredo-btn bs-segredo-copiar" aria-label="Copiar"><svg class="bs-segredo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    </div>
  </div>
</div>
<script type="module">
const OLHO = '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>'
const OLHO_CORTE = '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>'
const CHECK = '<path d="M20 6 9 17l-5-5"/>'

/**
 * @param raiz elemento .bs-segredo
 * @param carregar () => Promise<string>. O valor nunca vem do HTML: é esta
 *   função que busca (e decifra) no clique, e o resultado é descartado ao
 *   ocultar. Guardar o segredo num data-* devolveria ele pro DOM, que é
 *   exatamente o que a máscara evita.
 */
export function iniciarSegredo(raiz, carregar) {
  const valor = raiz.querySelector('.bs-segredo-valor')
  const olho = raiz.querySelector('.bs-segredo-olho')
  const copiar = raiz.querySelector('.bs-segredo-copiar')
  const mascara = valor.textContent
  let revelado = false

  const obter = () => carregar()

  olho.addEventListener('click', async () => {
    if (revelado) {
      // Ocultar joga o texto real fora do DOM de novo.
      valor.textContent = mascara
      valor.classList.add('bs-oculto')
      olho.querySelector('svg').innerHTML = OLHO
      olho.setAttribute('aria-label', 'Revelar')
      revelado = false
      return
    }
    olho.disabled = true
    valor.textContent = await obter()
    valor.classList.remove('bs-oculto')
    olho.querySelector('svg').innerHTML = OLHO_CORTE
    olho.setAttribute('aria-label', 'Ocultar')
    olho.disabled = false
    revelado = true
  })

  // Copiar sem revelar: é o caminho mais comum, e o segredo não precisa
  // passar pela tela pra chegar no outro sistema.
  copiar.addEventListener('click', async () => {
    copiar.disabled = true
    await navigator.clipboard.writeText(await obter())
    const svg = copiar.querySelector('svg')
    const antes = svg.innerHTML
    svg.innerHTML = CHECK
    copiar.disabled = false
    setTimeout(() => { svg.innerHTML = antes }, 1500)
  })
}

// Num app de verdade, carregar() bate no servidor ou decifra no vault.
const COFRE = { api: 'sk_live_9f2c41ab77e0', painel: 'Vega#2026!painel' }
document.querySelectorAll('.bs-segredo').forEach((s) =>
  iniciarSegredo(s, async () => COFRE[s.dataset.rotulo]),
)
</script>
</body>
</html>
