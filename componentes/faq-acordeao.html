<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

.wrap { max-width: 1360px; margin: 0 auto; }
#faq { padding: 90px 40px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

.faq-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 64px; align-items: start; }
.faq-heading {
  font-family: 'Sora', sans-serif; font-weight: 700; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.03em; line-height: 1.05;
}
.faq-heading .dim { color: #555; }

.faq-list { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.faq-item { border-bottom: 1px solid var(--border); padding: 24px 0; cursor: pointer; }
.faq-row { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.faq-q { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: #d4d4d4; }
.faq-q.open { color: #fff; }
.faq-sign { font-size: 20px; color: var(--accent); flex-shrink: 0; line-height: 1; }
.faq-a {
  font-family: 'Manrope', sans-serif; font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 620px;
  overflow: hidden; max-height: 0; opacity: 0; margin-top: 0; transition: all 0.35s ease;
}
.faq-a.open { max-height: 200px; opacity: 1; margin-top: 14px; }
</style>
</head>
<body>
<section id="faq">
  <div class="wrap">
    <div class="faq-grid">
      <div class="faq-heading sora">Perguntas <span class="dim">frequentes.</span></div>
      <div class="faq-list" id="faqList"></div>
    </div>
  </div>
</section>
<script type="module">
export function initFaq(faqs) {
  const faqList = document.getElementById('faqList');
  let openIndex = 0;

  function render() {
    faqList.innerHTML = '';
    faqs.forEach(function (item, i) {
      const isOpen = i === openIndex;
      const row = document.createElement('div');
      row.className = 'faq-item';
      row.innerHTML =
        '<div class="faq-row">' +
          '<span class="faq-q sora' + (isOpen ? ' open' : '') + '">' + item.q + '</span>' +
          '<span class="faq-sign mono">' + (isOpen ? '−' : '+') + '</span>' +
        '</div>' +
        '<div class="faq-a' + (isOpen ? ' open' : '') + '">' + item.a + '</div>';
      row.addEventListener('click', function () {
        openIndex = isOpen ? -1 : i;
        render();
      });
      faqList.appendChild(row);
    });
  }

  render();
}

initFaq([
  { q: 'Quanto tempo leva?', a: 'Depende do escopo. Uma landing page fica pronta em cerca de uma semana; um site institucional, entre duas e três.' },
  { q: 'Como funciona o pagamento?', a: '50% na entrada, pra travar a agenda, e 50% na entrega, antes da publicação.' },
  { q: 'Você faz manutenção depois?', a: 'Faço. O código é entregue organizado justamente pra dar pra evoluir sem refazer tudo.' },
  { q: 'Preciso ter o conteúdo pronto?', a: 'Ajuda muito, mas não é obrigatório. O briefing cobre o que falta.' }
]);
</script>
</body>
</html>
