<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-card: #1f1f1f;
  --border: #2a2a2a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --accent: #0ea5e9;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Uma cor por fonte de receita — a mesma em pílula, gráfico e avatar. */
  --src-empresa: #0ea5e9;
  --src-impressionart: #8b5cf6;
  --src-moto: #f59e0b;
  --src-mos: #22c55e;
  --src-nata: #ec4899;

  --fonte: 'Manrope', sans-serif;
  --fonte-titulo: 'Sora', sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg-base); color: var(--text); font-family: var(--fonte); }

/* Número em tabela, card ou badge nunca "dança" ao atualizar. */
.bs-num { font-variant-numeric: tabular-nums; }

.bs-anual {
  width: min(760px, 100%);
  padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-surface);
}
.bs-anual-titulo {
  margin-bottom: 12px;
  font-family: var(--fonte-titulo); font-size: 15px; font-weight: 600; color: var(--text);
}

/* Legenda em HTML, não a do Chart.js: usa a tipografia do painel, quebra em
   várias linhas no celular e não rouba altura do canvas. */
.bs-anual-legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; }
.bs-anual-leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
.bs-anual-leg i { width: 8px; height: 8px; border-radius: 999px; }

/* Altura fixa com maintainAspectRatio: false — senão o Chart.js estica a
   altura conforme a largura e o painel dança a cada resize. */
.bs-anual-tela { position: relative; height: 260px; }
@media (min-width: 768px) { .bs-anual-tela { height: 320px; } }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

<div class="bs-anual">
  <div class="bs-anual-titulo">Entradas vs Despesas · 2026</div>

  <div class="bs-anual-legenda">
    <span class="bs-anual-leg"><i style="background: var(--src-empresa)"></i>Empresa</span>
    <span class="bs-anual-leg"><i style="background: var(--src-impressionart)"></i>Impressionart</span>
    <span class="bs-anual-leg"><i style="background: var(--src-moto)"></i>Moto</span>
    <span class="bs-anual-leg"><i style="background: var(--src-mos)"></i>MOS</span>
    <span class="bs-anual-leg"><i style="background: var(--danger)"></i>Despesa</span>
    <span class="bs-anual-leg"><i style="background: var(--accent)"></i>Saldo</span>
  </div>

  <div class="bs-anual-tela"><canvas id="bs-anual-canvas"></canvas></div>
</div>
<script type="module">
const brl = (v) =>
  (v < 0 ? '- ' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })

// Canvas não enxerga classe nem variável aplicada, mas lê o valor da custom
// property — assim a paleta continua morando num lugar só.
const token = (nome) => getComputedStyle(document.documentElement).getPropertyValue(nome).trim()

const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez']

/**
 * @param canvas <canvas> dentro de um container de altura fixa
 * @param dados { fontes: { rotulo, token, valores[12] }[], despesa: number[12] }
 */
export function iniciarGraficoAnual(canvas, dados) {
  const saldo = dados.despesa.map((d, i) => dados.fontes.reduce((s, f) => s + f.valores[i], 0) - d)

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: MESES,
      datasets: [
        ...dados.fontes.map((f) => ({
          type: 'bar',
          label: f.rotulo,
          data: f.valores,
          backgroundColor: token(f.token),
          // Entrada e despesa em pilhas separadas: empilhar as duas juntas
          // daria um total sem significado nenhum.
          stack: 'entrada',
          borderRadius: 2,
          maxBarThickness: 22,
        })),
        {
          type: 'bar',
          label: 'Despesa',
          data: dados.despesa,
          backgroundColor: token('--danger'),
          stack: 'despesa',
          borderRadius: 2,
          maxBarThickness: 22,
        },
        {
          type: 'line',
          label: 'Saldo',
          data: saldo,
          borderColor: token('--accent'),
          backgroundColor: token('--accent'),
          pointBackgroundColor: token('--accent'),
          fill: false,
          tension: 0.3,
          pointRadius: 3,
          borderWidth: 2,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      // Mostra as seis séries do mês de uma vez, sem exigir mira no ponto.
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${brl(ctx.parsed.y ?? 0)}` } },
      },
      scales: {
        x: {
          stacked: true,
          ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: false, color: token('--text-muted') },
          grid: { display: false },
        },
        y: {
          stacked: true,
          ticks: { font: { size: 10 }, color: token('--text-muted'), callback: (v) => brl(Number(v)) },
          grid: { color: 'rgba(148, 163, 184, 0.12)' },
        },
      },
    },
  })
}

iniciarGraficoAnual(document.getElementById('bs-anual-canvas'), {
  fontes: [
    { rotulo: 'Empresa', token: '--src-empresa', valores: [4800, 6200, 5100, 7300, 6900, 8200, 7600, 9100, 8400, 0, 0, 0] },
    { rotulo: 'Impressionart', token: '--src-impressionart', valores: [1200, 1800, 1500, 2100, 1900, 2400, 2200, 2600, 1260, 0, 0, 0] },
    { rotulo: 'Moto', token: '--src-moto', valores: [900, 1100, 800, 1400, 1200, 1600, 1300, 1500, 1100, 0, 0, 0] },
    { rotulo: 'MOS', token: '--src-mos', valores: [0, 400, 600, 500, 700, 900, 800, 1000, 1200, 0, 0, 0] },
  ],
  despesa: [3200, 4100, 3600, 4800, 4200, 5100, 4600, 5400, 9420, 0, 0, 0],
})
</script>
</body>
</html>
