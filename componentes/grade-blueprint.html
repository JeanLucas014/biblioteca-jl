<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

.blueprint {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  max-width: 1400px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.blueprint > div { border-right: 1px solid rgba(255,255,255,0.05); height: 100%; }
.blueprint > div:last-child { border-right: none; }
@media (max-width: 700px) {
  .blueprint { display: none; }
}

.wrap { max-width: 1360px; margin: 0 auto; }
section { padding: 90px 40px; position: relative; z-index: 2; }
.demo-heading { font-weight: 600; font-size: clamp(26px, 3.5vw, 40px); letter-spacing: -0.03em; margin-bottom: 16px; }
.demo-texto { color: var(--text-muted); line-height: 1.6; max-width: 520px; margin: 0; }
</style>
</head>
<body>
<div class="blueprint">
  <div></div>
  <div></div>
  <div></div>
  <div></div>
</div>

<section>
  <div class="wrap">
    <div class="demo-heading sora">As linhas ficam atrás do conteúdo.</div>
    <p class="demo-texto">Quatro colunas fixas, com teto de 1400px pra acompanhar a largura do texto.</p>
  </div>
</section>

</body>
</html>
