<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

.wrap { max-width: 1360px; margin: 0 auto; }
section { padding: 90px 40px; position: relative; z-index: 2; }

.section-eyebrow {
  display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 64px;
}
.section-eyebrow .label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; }
.section-eyebrow .label span { color: var(--text-faint); }
.section-eyebrow .index { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); }

@media (max-width: 700px) {
  section { padding: 64px 20px; }
  .section-eyebrow { margin-bottom: 40px; }
}

.demo-heading { font-weight: 600; font-size: clamp(32px, 4vw, 56px); letter-spacing: -0.03em; line-height: 1; }
.demo-heading span { color: var(--accent); }
</style>
</head>
<body>
<section>
  <div class="wrap">
    <div class="section-eyebrow">
      <div class="label mono"><span>(01)</span> // projetos</div>
      <div class="index mono">index / 01_06</div>
    </div>
    <div class="demo-heading sora">Trabalhos selecionados <span>.</span></div>
  </div>
</section>

</body>
</html>
