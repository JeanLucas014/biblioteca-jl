<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-card: #1f1f1f;
  --border: #2a2a2a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --accent: #0ea5e9;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Uma cor por fonte de receita — a mesma em pílula, gráfico e avatar. */
  --src-empresa: #0ea5e9;
  --src-impressionart: #8b5cf6;
  --src-moto: #f59e0b;
  --src-mos: #22c55e;
  --src-nata: #ec4899;

  --fonte: 'Manrope', sans-serif;
  --fonte-titulo: 'Sora', sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg-base); color: var(--text); font-family: var(--fonte); }

/* Número em tabela, card ou badge nunca "dança" ao atualizar. */
.bs-num { font-variant-numeric: tabular-nums; }

.bs-valor {
  width: min(420px, 100%);
  padding: 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-base);
}

.bs-valor-rotulo {
  margin-bottom: 8px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
}

.bs-valor-linha { display: flex; align-items: baseline; gap: 8px; }
/* Fora do input pra nunca ser apagado junto com o número. */
.bs-valor-moeda { font-size: 22px; font-weight: 500; color: var(--text-muted); }

.bs-valor-input {
  width: 100%; border: none; outline: none; background: transparent;
  font-family: var(--fonte-titulo); font-size: 44px; font-weight: 600;
  letter-spacing: -0.03em; color: var(--text);
}
.bs-valor-entrada .bs-valor-input { color: var(--success); }
.bs-valor-saida .bs-valor-input { color: var(--danger); }

.bs-valor-ajuda { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="bs-valor" data-centavos="1248000">
  <div class="bs-valor-rotulo">Valor</div>
  <div class="bs-valor-linha">
    <span class="bs-valor-moeda">R$</span>
    <input class="bs-valor-input bs-num" inputmode="numeric" value="12.480,00" aria-label="Valor em reais">
  </div>
  <div class="bs-valor-ajuda">Entrada em Empresa · setembro</div>
</div>
<script type="module">
// Centavos como inteiro, sempre. Float em dinheiro vira diferença de um
// centavo na conciliação, e ninguém acha de onde veio.
function formatar(centavos) {
  return (centavos / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
}

export function iniciarCampoValor(raiz, aoMudar) {
  const input = raiz.querySelector('.bs-valor-input')

  input.addEventListener('input', () => {
    // Reconstrói do inteiro a cada tecla: o cursor fica no fim e o backspace
    // apaga da direita, como numa maquininha.
    const digitos = input.value.replace(/\D/g, '')
    const centavos = digitos === '' ? 0 : parseInt(digitos, 10)
    raiz.dataset.centavos = String(centavos)
    input.value = formatar(centavos)
    aoMudar?.(centavos)
  })
}

iniciarCampoValor(document.querySelector('.bs-valor'))
</script>
</body>
</html>
