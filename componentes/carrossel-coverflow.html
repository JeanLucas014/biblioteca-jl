<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

/* A largura do card é o único número solto — passo, profundidade e
   perspectiva são todos derivados dela no JS. */
.cf {
  --cf-card: clamp(200px, 26vw, 340px);
  position: relative;
}

/* O padding vertical mantém as sombras longe do recorte do overflow. */
.cf-frame {
  overflow: hidden;
  padding: 40px 0;
  outline: none;
  cursor: grab;
  /* O arrasto horizontal é nosso; a página continua rolando na vertical. */
  touch-action: pan-y;
}
.cf-frame:active { cursor: grabbing; }
.cf-frame:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; border-radius: 8px; }

.cf-track {
  position: relative;
  height: var(--cf-card);
  transform-style: preserve-3d;
  user-select: none;
}

.cf-card {
  position: absolute; left: 50%; top: 0;
  width: var(--cf-card); aspect-ratio: 1;
  overflow: hidden; border-radius: 16px;
  background: var(--bg-alt); border: 1px solid var(--border-alt);
  box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.8);
  will-change: transform;
}
.cf-card img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; }

/* Só o card do centro fica em cor cheia; os outros recuam para o fundo. */
.cf-card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: rgba(5, 5, 5, 0.45);
  transition: background 0.3s ease;
}
.cf-card.is-center::after { background: transparent; }
.cf-card.is-center { border-color: var(--accent); }

.cf-nav {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 200;
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10, 10, 10, 0.75); backdrop-filter: blur(6px);
  border: 1px solid var(--border-alt); color: #fff;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.cf-nav:hover { background: var(--accent); border-color: transparent; color: var(--bg); }
.cf-prev { left: 8px; }
.cf-next { right: 8px; }

.cf-caption { margin-top: 28px; text-align: center; }
.cf-caption-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.cf-caption-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 8px; }

.cf-dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.cf-dot {
  width: 7px; height: 7px; border-radius: 50%; padding: 0;
  background: var(--text); border: 0; opacity: 0.25;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.cf-dot[aria-current="true"] { opacity: 1; background: var(--accent); transform: scale(1.25); }

.cf-hint {
  margin-top: 18px; text-align: center;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer);
  letter-spacing: 0.12em; text-transform: uppercase;
}

@media (max-width: 700px) {
  .cf { --cf-card: 62vw; }
  .cf-nav { display: none; }
}
</style>
</head>
<body>
<div class="cf" id="cf">
  <button class="cf-nav cf-prev" aria-label="Anterior">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="cf-frame" tabindex="0" aria-label="Carrossel de projetos">
    <div class="cf-track"></div>
  </div>
  <button class="cf-nav cf-next" aria-label="Próximo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div class="cf-caption">
    <div class="cf-caption-title"></div>
    <div class="cf-caption-sub"></div>
  </div>
  <div class="cf-dots"></div>
  <div class="cf-hint mono">arraste ou use as setas</div>
</div>
<script type="module">
// A posição é uma única fonte de verdade: `pos`, o índice fracionário do
// card que está no centro. Tudo o mais é derivado dela.

const ROTATE = 44;      // graus que o primeiro vizinho inclina
const DEPTH = 0.6;      // quanto ele recua, em fração da largura do card
const FALLOFF = 0.56;   // expoente da distância; abaixo de 1 a inclinação alivia
const FADE = 0.1;       // opacidade perdida por card de distância
const GAP = 0.05;       // espaço entre cards, em fração da largura
const PERSPECTIVE = 3;  // distância do observador, em múltiplos da largura

export function createCoverflow(config) {
  const frame = config.frame;
  const track = config.track;
  const slides = config.slides;
  const onSelect = config.onSelect;
  const count = slides.length;
  if (!count) return null;

  const cards = [];
  let pos = 0;        // onde estamos
  let target = 0;     // para onde a animação vai
  let width = 0;
  let raf = null;
  let selected = -1;
  let drag = null;

  track.innerHTML = '';
  slides.forEach(function (slide, i) {
    const card = document.createElement(slide.url ? 'a' : 'div');
    card.className = 'cf-card';
    if (slide.url) {
      card.href = slide.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
    }
    card.setAttribute('role', 'group');
    card.setAttribute('aria-label', (i + 1) + ' de ' + count);
    card.innerHTML =
      '<img src="' + slide.image + '" alt="Captura do site ' + slide.title + '" draggable="false" loading="lazy">';
    // Um arrasto termina em click; sem isso, girar o carrossel abriria o site.
    card.addEventListener('click', function (e) {
      if (card.dataset.arrastou === '1') {
        e.preventDefault();
        card.dataset.arrastou = '';
      }
    });
    track.appendChild(card);
    cards.push(card);
  });

  function indexAt(p) {
    return ((Math.round(p) % count) + count) % count;
  }

  // Pinta direto no DOM: sessenta atualizações por segundo não passam por
  // lugar nenhum além do style de cada card.
  function paint() {
    if (!width) return;
    const pitch = width * (1 + GAP);

    for (let i = 0; i < count; i++) {
      // Dobra a distância pelo lado mais curto do anel. É todo o mecanismo
      // de loop — sem clonar nó, sem remexer o DOM.
      let offset = i - pos;
      offset = ((offset % count) + count) % count;
      if (offset > count / 2) offset -= count;

      const distance = Math.abs(offset);
      const ramp = Math.pow(distance, FALLOFF);
      // Limitado antes de ficar de perfil, para um card distante nunca virar
      // as costas.
      const tilt = Math.min(ROTATE * ramp, 82) * Math.sign(offset);

      cards[i].style.transform =
        'translateX(calc(-50% + ' + (offset * pitch) + 'px)) ' +
        'translateZ(' + (-DEPTH * width * ramp) + 'px) ' +
        'rotateY(' + (-tilt) + 'deg)';

      // O card é teletransportado para o outro lado do anel exatamente a meia
      // volta, então precisa já ter sumido quando chegar lá.
      const edge = Math.min(1, Math.max(0, count / 2 - distance));
      cards[i].style.opacity = String(Math.max(0, 1 - FADE * distance) * edge);
      cards[i].style.zIndex = String(100 - Math.round(distance));
      cards[i].classList.toggle('is-center', Math.round(distance) === 0);
    }
  }

  function anunciar(i) {
    if (i === selected) return;
    selected = i;
    if (onSelect) onSelect(i, slides[i]);
  }

  function settle(destino) {
    if (raf !== null) cancelAnimationFrame(raf);
    target = destino;
    anunciar(indexAt(destino));

    function step() {
      const falta = target - pos;
      if (Math.abs(falta) < 0.0004) {
        pos = target;
        paint();
        raf = null;
        return;
      }
      // ease-out exponencial, não mola. Só troque por mola se a parada
      // precisar passar do ponto e voltar.
      pos += falta * 0.16;
      paint();
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  function goTo(i) {
    // Vai pelo lado mais curto, em vez de desenrolar o anel inteiro.
    settle(i + Math.round((target - i) / count) * count);
  }

  function nudge(by) {
    settle(Math.round(target) + by);
  }

  frame.addEventListener('pointerdown', function (e) {
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
    frame.setPointerCapture(e.pointerId);
    target = pos;
    drag = { id: e.pointerId, x: e.clientX, pos: pos, v: 0, t: performance.now(), andou: 0 };
  });

  frame.addEventListener('pointermove', function (e) {
    if (!drag || drag.id !== e.pointerId) return;
    const pitch = width * (1 + GAP);
    if (!pitch) return;
    const agora = performance.now();
    const antes = pos;
    const dx = e.clientX - drag.x;
    drag.andou = Math.max(drag.andou, Math.abs(dx));
    pos = drag.pos - dx / pitch;
    // Cards por segundo, para o arremesso.
    drag.v = ((pos - antes) / Math.max(agora - drag.t, 1)) * 1000;
    drag.t = agora;
    anunciar(indexAt(pos));
    paint();
  });

  function endDrag(e) {
    if (!drag || drag.id !== e.pointerId) return;
    const andou = drag.andou;
    const v = drag.v;
    drag = null;
    if (andou > 6) {
      const alvo = cards[indexAt(pos)];
      if (alvo) alvo.dataset.arrastou = '1';
    }
    // Deixa o impulso carregar, mas nunca mais que dois cards.
    const carregado = Math.max(-2, Math.min(2, v * 0.18));
    settle(Math.round(pos + carregado));
  }
  frame.addEventListener('pointerup', endDrag);
  frame.addEventListener('pointercancel', endDrag);

  frame.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(1); }
  });

  // A largura do card manda no passo, na profundidade e na perspectiva, então
  // é a única coisa que vale medir — e só quando a caixa muda de tamanho.
  function measure() {
    if (!cards[0]) return;
    width = cards[0].offsetWidth;
    frame.style.perspective = (width * PERSPECTIVE) + 'px';
    paint();
  }
  const observer = new ResizeObserver(measure);
  observer.observe(frame);
  measure();
  anunciar(0);

  return {
    goTo: goTo,
    nudge: nudge,
    destroy: function () {
      observer.disconnect();
      if (raf !== null) cancelAnimationFrame(raf);
    }
  };
}

const raiz = document.getElementById('cf');
const slides = [
  { title: 'Nata Business', tag: 'Institucional', image: "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'%3E%3Crect width='320' height='200' fill='%230a0a0a'/%3E%3Crect x='0' y='0' width='320' height='26' fill='%23111'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%230ea5e9'/%3E%3Crect x='200' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='238' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='276' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='24' y='58' width='150' height='14' rx='3' fill='%23e5e5e5'/%3E%3Crect x='24' y='80' width='110' height='14' rx='3' fill='%23555'/%3E%3Crect x='24' y='112' width='84' height='24' rx='4' fill='%230ea5e9'/%3E%3Crect x='210' y='52' width='86' height='86' rx='8' fill='%23161616'/%3E%3C/svg%3E" },
  { title: 'Impressionart', tag: 'E-commerce', image: "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'%3E%3Crect width='320' height='200' fill='%230a0a0a'/%3E%3Crect x='0' y='0' width='320' height='26' fill='%23111'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%230ea5e9'/%3E%3Crect x='200' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='238' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='276' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='24' y='58' width='150' height='14' rx='3' fill='%23e5e5e5'/%3E%3Crect x='24' y='80' width='110' height='14' rx='3' fill='%23555'/%3E%3Crect x='24' y='112' width='84' height='24' rx='4' fill='%230ea5e9'/%3E%3Crect x='210' y='52' width='86' height='86' rx='8' fill='%23161616'/%3E%3C/svg%3E" },
  { title: 'MOS', tag: 'Sistema', image: "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'%3E%3Crect width='320' height='200' fill='%230a0a0a'/%3E%3Crect x='0' y='0' width='320' height='26' fill='%23111'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%230ea5e9'/%3E%3Crect x='200' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='238' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='276' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='24' y='58' width='150' height='14' rx='3' fill='%23e5e5e5'/%3E%3Crect x='24' y='80' width='110' height='14' rx='3' fill='%23555'/%3E%3Crect x='24' y='112' width='84' height='24' rx='4' fill='%230ea5e9'/%3E%3Crect x='210' y='52' width='86' height='86' rx='8' fill='%23161616'/%3E%3C/svg%3E" },
  { title: 'Vida Leve', tag: 'Landing Page', image: "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'%3E%3Crect width='320' height='200' fill='%230a0a0a'/%3E%3Crect x='0' y='0' width='320' height='26' fill='%23111'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%230ea5e9'/%3E%3Crect x='200' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='238' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='276' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='24' y='58' width='150' height='14' rx='3' fill='%23e5e5e5'/%3E%3Crect x='24' y='80' width='110' height='14' rx='3' fill='%23555'/%3E%3Crect x='24' y='112' width='84' height='24' rx='4' fill='%230ea5e9'/%3E%3Crect x='210' y='52' width='86' height='86' rx='8' fill='%23161616'/%3E%3C/svg%3E" },
  { title: 'Studio Verde', tag: 'Institucional', image: "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'%3E%3Crect width='320' height='200' fill='%230a0a0a'/%3E%3Crect x='0' y='0' width='320' height='26' fill='%23111'/%3E%3Ccircle cx='16' cy='13' r='4' fill='%230ea5e9'/%3E%3Crect x='200' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='238' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='276' y='9' width='30' height='8' rx='4' fill='%23222'/%3E%3Crect x='24' y='58' width='150' height='14' rx='3' fill='%23e5e5e5'/%3E%3Crect x='24' y='80' width='110' height='14' rx='3' fill='%23555'/%3E%3Crect x='24' y='112' width='84' height='24' rx='4' fill='%230ea5e9'/%3E%3Crect x='210' y='52' width='86' height='86' rx='8' fill='%23161616'/%3E%3C/svg%3E" }
];

const dots = raiz.querySelector('.cf-dots');
const titulo = raiz.querySelector('.cf-caption-title');
const sub = raiz.querySelector('.cf-caption-sub');

slides.forEach(function (s, i) {
  const b = document.createElement('button');
  b.className = 'cf-dot';
  b.type = 'button';
  b.setAttribute('aria-label', 'Ir para ' + s.title);
  b.addEventListener('click', function () { carrossel.goTo(i); });
  dots.appendChild(b);
});

const carrossel = createCoverflow({
  frame: raiz.querySelector('.cf-frame'),
  track: raiz.querySelector('.cf-track'),
  slides: slides,
  onSelect: function (i, slide) {
    titulo.textContent = slide.title;
    sub.textContent = slide.tag;
    dots.querySelectorAll('.cf-dot').forEach(function (d, j) {
      d.setAttribute('aria-current', j === i ? 'true' : 'false');
    });
  }
});

raiz.querySelector('.cf-prev').addEventListener('click', function () { carrossel.nudge(-1); });
raiz.querySelector('.cf-next').addEventListener('click', function () { carrossel.nudge(1); });
</script>
</body>
</html>
