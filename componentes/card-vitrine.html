<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
.cv-grade {
  width: min(820px, 100%);
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.cv-card {
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  background: var(--bg-alt);
  transition: border-color 0.2s ease;
}
.cv-card:hover { border-color: var(--accent); }

/* A moldura recorta: o zoom acontece aqui dentro e o card mantém o tamanho,
   então a grade não reflui. Scale no card faria a fileira inteira tremer. */
.cv-moldura {
  aspect-ratio: 4 / 3;
  overflow: hidden;
  display: grid; place-items: center;
  background: var(--bg);
}
.cv-foto {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s ease;
}
.cv-card:hover .cv-foto { transform: scale(1.05); }

/* Item sem foto cai num bloco com ícone. Moldura vazia parece erro de
   carregamento; onerror na <img> pisca a imagem rota antes de sumir. */
.cv-sem-foto .cv-moldura { background: var(--bg-alt); }
.cv-vazio { width: 40px; height: 40px; color: var(--text-dimmer); }

.cv-pe { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; }
.cv-ic { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; color: var(--accent); }
.cv-pe h3 { margin: 0; font-family: 'Sora', sans-serif; font-size: 14px; line-height: 1.35; }
</style>
</head>
<body>
<div class="cv-grade">
  <article class="cv-card">
    <div class="cv-moldura">
      <img class="cv-foto" alt="" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22800%22%20height%3D%22600%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23475569%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231e293b%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22800%22%20height%3D%22600%22%20fill%3D%22url(%2523g)%22%2F%3E%3C%2Fsvg%3E">
    </div>
    <div class="cv-pe">
      <svg class="cv-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>
      <h3>Com foto</h3>
    </div>
  </article>

  <article class="cv-card">
    <div class="cv-moldura">
      <img class="cv-foto" alt="" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22800%22%20height%3D%22600%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23525252%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23171717%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22800%22%20height%3D%22600%22%20fill%3D%22url(%2523g)%22%2F%3E%3C%2Fsvg%3E">
    </div>
    <div class="cv-pe">
      <svg class="cv-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>
      <h3>Passe o mouse: a moldura não cresce</h3>
    </div>
  </article>

  <article class="cv-card cv-sem-foto">
    <div class="cv-moldura">
      <svg class="cv-vazio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <div class="cv-pe">
      <svg class="cv-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>
      <h3>Sem foto, cai no ícone</h3>
    </div>
  </article>
</div>

</body>
</html>
