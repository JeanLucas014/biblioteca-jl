<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-card: #1f1f1f;
  --border: #2a2a2a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --accent: #0ea5e9;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Uma cor por fonte de receita — a mesma em pílula, gráfico e avatar. */
  --src-empresa: #0ea5e9;
  --src-impressionart: #8b5cf6;
  --src-moto: #f59e0b;
  --src-mos: #22c55e;
  --src-nata: #ec4899;

  --fonte: 'Manrope', sans-serif;
  --fonte-titulo: 'Sora', sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg-base); color: var(--text); font-family: var(--fonte); }

/* Número em tabela, card ou badge nunca "dança" ao atualizar. */
.bs-num { font-variant-numeric: tabular-nums; }

.bs-sheet-camada {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: flex-end;
}
/* O fundo é irmão do painel, não pai: clique no conteúdo não sobe pra ele. */
.bs-sheet-fundo { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); }

.bs-sheet {
  position: relative; z-index: 10;
  width: 100%; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 12px 20px 32px;
  border-top: 1px solid var(--border); border-radius: 24px 24px 0 0;
  background: var(--bg-surface);
}
.bs-sheet::-webkit-scrollbar { display: none; }

/* Não arrasta nada: é a affordance de "isto veio de baixo", e por isso some
   no desktop, onde o painel não vem de lugar nenhum. */
.bs-sheet-puxador {
  width: 36px; height: 4px; margin: 0 auto 16px;
  border-radius: 999px; background: var(--border);
}

@media (min-width: 768px) {
  .bs-sheet-camada { align-items: center; justify-content: center; }
  .bs-sheet {
    width: 420px; padding: 12px 20px 24px;
    border: 1px solid var(--border); border-radius: 24px;
  }
  .bs-sheet-puxador { display: none; }
}

.bs-sheet-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.bs-sheet-titulo { font-family: var(--fonte-titulo); font-size: 18px; font-weight: 600; color: var(--text); }
.bs-sheet-fechar {
  display: grid; place-items: center; width: 32px; height: 32px;
  border: none; border-radius: 8px; color: var(--text-muted); background: var(--bg-card);
}
.bs-sheet-ic { width: 16px; height: 16px; }

.bs-campo { margin-bottom: 16px; }
.bs-campo-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.bs-rotulo {
  display: block; margin-bottom: 6px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
}

.bs-input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  font-family: var(--fonte); font-size: 13px; color: var(--text);
  background: var(--bg-base); outline: none;
  /* Sem isto o select volta a ser o widget do sistema, claro e fora do tema. */
  appearance: none;
}
.bs-input:focus { border-color: var(--accent); }

/* O erro do salvamento fica acima das ações, e some quando não há erro — o
   botão nunca muda de lugar por causa dele. */
.bs-sheet-erro { margin-bottom: 16px; font-size: 12px; color: var(--danger); }
.bs-sheet-erro[hidden] { display: none; }

.bs-sheet-acoes { display: flex; gap: 8px; margin-top: 20px; }

/* Existe, mas não disputa: sem texto e sem crescer na linha. */
.bs-excluir {
  display: grid; place-items: center; padding: 14px 16px; border-radius: 12px;
  color: var(--danger);
  border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
  background: color-mix(in srgb, var(--danger) 10%, transparent);
}

.bs-salvar {
  flex: 1; padding: 14px; border: none; border-radius: 12px;
  font-family: var(--fonte-titulo); font-size: 15px; font-weight: 600;
  color: var(--bg-base); background: var(--accent);
}
.bs-salvar:disabled, .bs-excluir:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div class="bs-sheet-camada">
  <div class="bs-sheet-fundo"></div>

  <div class="bs-sheet" role="dialog" aria-modal="true" aria-labelledby="bs-sheet-titulo">
    <div class="bs-sheet-puxador"></div>

    <div class="bs-sheet-topo">
      <div class="bs-sheet-titulo" id="bs-sheet-titulo">Editar tarefa</div>
      <button type="button" class="bs-sheet-fechar" aria-label="Fechar"><svg class="bs-sheet-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>

    <div class="bs-campo">
      <label class="bs-rotulo" for="bs-titulo">Título</label>
      <input class="bs-input" id="bs-titulo" type="text" value="Fechar remessa da Impressionart">
    </div>

    <div class="bs-campo bs-campo-duplo">
      <div>
        <label class="bs-rotulo" for="bs-prazo">Prazo</label>
        <input class="bs-input" id="bs-prazo" type="date" value="2026-09-08">
      </div>
      <div>
        <label class="bs-rotulo" for="bs-prioridade">Prioridade</label>
        <select class="bs-input" id="bs-prioridade">
          <option>Alta</option>
          <option selected>Média</option>
          <option>Baixa</option>
        </select>
      </div>
    </div>

    <div class="bs-campo">
      <label class="bs-rotulo" for="bs-cliente">Cliente</label>
      <select class="bs-input" id="bs-cliente">
        <option>Sem cliente</option>
        <option selected>Clínica Vega</option>
        <option>Marina Vasques</option>
      </select>
    </div>

    <div class="bs-sheet-erro" hidden>Falha ao salvar: verifique a conexão.</div>

    <div class="bs-sheet-acoes">
      <button type="button" class="bs-excluir" aria-label="Excluir"><svg class="bs-sheet-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      <button type="button" class="bs-salvar">Salvar</button>
    </div>
  </div>
</div>

</body>
</html>
