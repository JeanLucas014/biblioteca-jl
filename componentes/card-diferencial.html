<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
.diferencial-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.diferencial-card {
  background: var(--bg-alt); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px;
  display: flex; flex-direction: column; gap: 24px; min-height: 300px; transition: border-color 0.3s;
}
.diferencial-card:hover { border-color: var(--border-alt); }
.diferencial-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
.diferencial-icon {
  width: 48px; height: 48px; border-radius: 10px; background: rgba(14,165,233,0.08); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.diferencial-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint); letter-spacing: 0.15em; }
.diferencial-card .body { flex: 1; }
.diferencial-card .title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em; margin-bottom: 14px; }
.diferencial-card .desc { font-family: 'Manrope', sans-serif; font-size: 15px; color: var(--text-muted); line-height: 1.6; }
.diferencial-bar { height: 2px; width: 32px; background: var(--accent); }
</style>
</head>
<body>
<div class="diferencial-grid">
  <div class="diferencial-card">
    <div class="top-row">
      <div class="diferencial-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
      </div>
      <span class="diferencial-num mono">01</span>
    </div>
    <div class="body">
      <div class="title sora">Performance</div>
      <div class="desc">Cada segundo de carregamento é alguém saindo antes de ver o que você construiu. Isso entra desde a primeira linha de código.</div>
    </div>
    <div class="diferencial-bar"></div>
  </div>

  <div class="diferencial-card">
    <div class="top-row">
      <div class="diferencial-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      </div>
      <span class="diferencial-num mono">02</span>
    </div>
    <div class="body">
      <div class="title sora">Estrutura</div>
      <div class="desc">Layout bonito sem hierarquia clara só confunde quem chega. Cada página guia quem usa até onde precisa chegar.</div>
    </div>
    <div class="diferencial-bar"></div>
  </div>
</div>

</body>
</html>
