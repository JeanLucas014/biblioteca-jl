<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-card: #1f1f1f;
  --border: #2a2a2a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --accent: #0ea5e9;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Uma cor por fonte de receita — a mesma em pílula, gráfico e avatar. */
  --src-empresa: #0ea5e9;
  --src-impressionart: #8b5cf6;
  --src-moto: #f59e0b;
  --src-mos: #22c55e;

  --fonte: 'Manrope', sans-serif;
  --fonte-titulo: 'Sora', sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg-base); color: var(--text); font-family: var(--fonte); }

/* Número em tabela, card ou badge nunca "dança" ao atualizar. */
.bs-num { font-variant-numeric: tabular-nums; }

.bs-pills {
  width: min(560px, 100%);
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}

.bs-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 12px; border-radius: 10px;
  font-family: var(--fonte); font-size: 13px; font-weight: 500;
  color: var(--text-muted); background: var(--bg-card);
  /* Sempre 1.5px: trocar a espessura junto com a seleção empurraria as
     pílulas vizinhas meio pixel a cada clique. */
  border: 1.5px solid var(--border);
  transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
}

.bs-pill-ponto { width: 8px; height: 8px; flex-shrink: 0; border-radius: 999px; background: var(--cor); }

.bs-pill.bs-sel {
  font-weight: 600; color: var(--text);
  border-color: color-mix(in srgb, var(--cor) 40%, transparent);
  background: color-mix(in srgb, var(--cor) 15%, transparent);
}
</style>
</head>
<body>
<div class="bs-pills">
  <button type="button" class="bs-pill bs-sel" aria-pressed="true" style="--cor: var(--src-empresa)">
    <span class="bs-pill-ponto"></span> Empresa
  </button>
  <button type="button" class="bs-pill" aria-pressed="false" style="--cor: var(--src-impressionart)">
    <span class="bs-pill-ponto"></span> Impressionart
  </button>
  <button type="button" class="bs-pill" aria-pressed="false" style="--cor: var(--src-moto)">
    <span class="bs-pill-ponto"></span> Moto
  </button>
  <button type="button" class="bs-pill" aria-pressed="false" style="--cor: var(--src-mos)">
    <span class="bs-pill-ponto"></span> MOS
  </button>
</div>

</body>
</html>
