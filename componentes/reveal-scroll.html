<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

/* Tudo depende da classe .reveal-on na raiz, que o JS só adiciona quando o
   sistema não pede menos movimento — sem ela nada é escondido, então a página
   funciona igual com JS desligado. */
.reveal-on [data-reveal] > * {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  transition-delay: var(--reveal-delay, 0ms);
}
.reveal-on [data-reveal].is-revealed > * {
  opacity: 1;
  transform: none;
}

/* Os filhos em cascata herdam o próprio atraso, calculado no JS. */
.reveal-on [data-reveal] [data-reveal-stagger] > * {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  transition-delay: var(--reveal-delay, 0ms);
}
.reveal-on [data-reveal].is-revealed [data-reveal-stagger] > * {
  opacity: 1;
  transform: none;
}

section { padding: 90px 40px; border-bottom: 1px solid var(--border); max-width: 1360px; margin: 0 auto; }
.demo-eyebrow { font-size: 12px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 24px; }
.demo-heading { font-weight: 600; font-size: clamp(26px, 3.5vw, 40px); letter-spacing: -0.03em; }
.demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 32px; }
.demo-card {
  background: var(--bg-alt); border: 1px solid var(--border); border-radius: 12px;
  padding: 32px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim);
}
</style>
</head>
<body>
<section data-reveal>
  <div class="demo-eyebrow mono">(01) // role a página</div>
  <div class="demo-heading sora">Cada bloco entra uma vez.</div>
</section>

<section data-reveal>
  <div class="demo-eyebrow mono">(02) // cascata</div>
  <div class="demo-heading sora">E os filhos entram em cascata.</div>
  <div class="demo-grid" data-reveal-stagger>
    <div class="demo-card">01</div>
    <div class="demo-card">02</div>
    <div class="demo-card">03</div>
    <div class="demo-card">04</div>
  </div>
</section>

<section data-reveal>
  <div class="demo-eyebrow mono">(03) // fim</div>
  <div class="demo-heading sora">Não some ao rolar de volta.</div>
</section>
<script type="module">
export function initReveal() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const alvos = document.querySelectorAll('[data-reveal]');
  if (!alvos.length || !('IntersectionObserver' in window)) return;

  document.documentElement.classList.add('reveal-on');

  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-revealed');
      observer.unobserve(entry.target);
    });
  }, {
    // Dispara um pouco antes de encostar na borda, para o movimento já estar
    // acontecendo quando o olho chega.
    rootMargin: '0px 0px -12% 0px',
    threshold: 0.05
  });

  alvos.forEach(function (alvo) {
    const filhos = alvo.querySelectorAll('[data-reveal-stagger] > *');
    filhos.forEach(function (filho, i) {
      filho.style.setProperty('--reveal-delay', (i * 70) + 'ms');
    });
    observer.observe(alvo);
  });
}

initReveal();
</script>
</body>
</html>
