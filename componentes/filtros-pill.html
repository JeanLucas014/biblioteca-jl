<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; max-width: 600px; }
.filter-btn {
  padding: 10px 16px; background: transparent; border: 1px solid var(--border-alt); border-radius: 100px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em;
  text-transform: uppercase; cursor: pointer;
}
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<div class="filters" id="filters"></div>
<script type="module">
const filterLabels = {
  todos: 'Todos',
  institucional: 'Institucional',
  ecommerce: 'E-commerce',
  landing: 'Landing Page',
  sistema: 'Sistema'
};

export function initFilters(el, onChange) {
  let ativo = 'todos';

  function render() {
    el.innerHTML = '';
    Object.keys(filterLabels).forEach(function (chave) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (chave === ativo ? ' active' : '');
      btn.type = 'button';
      btn.textContent = filterLabels[chave];
      btn.addEventListener('click', function () {
        ativo = chave;
        render();
        if (onChange) onChange(chave);
      });
      el.appendChild(btn);
    });
  }

  render();
}

initFilters(document.getElementById('filters'));
</script>
</body>
</html>
