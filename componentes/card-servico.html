<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
.services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.service-card {
  background: var(--bg-alt); border: 1px solid var(--border); border-radius: 16px; padding: 32px;
  display: flex; flex-direction: column; gap: 20px; min-height: 220px; transition: border-color 0.3s;
}
.service-card:hover { border-color: var(--accent); }
.service-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
.service-icon {
  width: 48px; height: 48px; border-radius: 10px; background: rgba(14,165,233,0.1); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.service-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dimmer); letter-spacing: 0.15em; }
.service-card .body { flex: 1; }
.service-card .title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; margin-bottom: 10px; }
.service-card .desc { font-family: 'Manrope', sans-serif; font-size: 14px; color: var(--text-muted); line-height: 1.55; }

@media (max-width: 560px) {
  .services-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="services-grid">
  <div class="service-card">
    <div class="top-row">
      <div class="service-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </div>
      <span class="service-num mono">01</span>
    </div>
    <div class="body">
      <div class="title sora">Site Institucional</div>
      <div class="desc">Presença profissional pra sua empresa, com as páginas que o cliente precisa encontrar.</div>
    </div>
  </div>

  <div class="service-card">
    <div class="top-row">
      <div class="service-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      </div>
      <span class="service-num mono">02</span>
    </div>
    <div class="body">
      <div class="title sora">E-commerce</div>
      <div class="desc">Loja virtual com catálogo, carrinho e checkout, pensada pra fechar venda.</div>
    </div>
  </div>
</div>

</body>
</html>
