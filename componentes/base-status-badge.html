<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-card: #1f1f1f;
  --border: #2a2a2a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --accent: #0ea5e9;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Uma cor por fonte de receita — a mesma em pílula, gráfico e avatar. */
  --src-empresa: #0ea5e9;
  --src-impressionart: #8b5cf6;
  --src-moto: #f59e0b;
  --src-mos: #22c55e;

  --fonte: 'Manrope', sans-serif;
  --fonte-titulo: 'Sora', sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg-base); color: var(--text); font-family: var(--fonte); }

/* Número em tabela, card ou badge nunca "dança" ao atualizar. */
.bs-num { font-variant-numeric: tabular-nums; }

.bs-badges {
  width: min(560px, 100%);
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-surface);
}

.bs-badge {
  padding: 4px 10px; border-radius: 6px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  /* A cor cheia no texto, a mesma cor a 15% no fundo. Badge saturado sobre
     #0a0a0a rouba a atenção do número, que é o que importa na tela. */
  color: var(--cor);
  background: color-mix(in srgb, var(--cor) 15%, transparent);
}

.bs-b-ok { --cor: var(--success); }
.bs-b-esp { --cor: var(--warning); }
.bs-b-erro { --cor: var(--danger); }
.bs-b-mov { --cor: var(--accent); }
.bs-b-rev { --cor: var(--src-impressionart); }
.bs-b-neutro { --cor: var(--text-muted); }
</style>
</head>
<body>
<div class="bs-badges">
  <span class="bs-badge bs-b-ok">Realizado</span>
  <span class="bs-badge bs-b-ok">Cliente</span>
  <span class="bs-badge bs-b-ok">Aceita</span>
  <span class="bs-badge bs-b-ok">Completo</span>

  <span class="bs-badge bs-b-esp">Previsto</span>
  <span class="bs-badge bs-b-esp">Lead</span>
  <span class="bs-badge bs-b-esp">Não finalizado</span>

  <span class="bs-badge bs-b-erro">Atrasado</span>
  <span class="bs-badge bs-b-erro">Descartado</span>
  <span class="bs-badge bs-b-erro">Recusada</span>

  <span class="bs-badge bs-b-mov">Em andamento</span>
  <span class="bs-badge bs-b-mov">Enviada</span>

  <span class="bs-badge bs-b-rev">Revisão</span>

  <span class="bs-badge bs-b-neutro">Não iniciado</span>
  <span class="bs-badge bs-b-neutro">Finalizado</span>
  <span class="bs-badge bs-b-neutro">Arquivado</span>
</div>

</body>
</html>
