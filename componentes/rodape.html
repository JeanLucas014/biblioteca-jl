<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }

.wrap { max-width: 1360px; margin: 0 auto; }

footer { padding: 48px 40px; position: relative; z-index: 2; }
.footer-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-bottom: 40px; }
.footer-brand { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px; margin-bottom: 14px; }
.footer-brand span { color: var(--accent); font-weight: 400; }
.footer-desc { font-family: 'Manrope', sans-serif; font-size: 13px; color: #666; line-height: 1.6; max-width: 280px; }
.footer-col-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #666; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 14px; }
.footer-links { display: flex; flex-direction: column; gap: 8px; font-family: 'Manrope', sans-serif; font-size: 14px; }
.footer-links a { color: #d4d4d4; }
.footer-bottom {
  padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between;
  align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dimmer);
  letter-spacing: 0.08em; flex-wrap: wrap; gap: 12px;
}
.footer-bottom span:last-child span { color: #fff; }

@media (max-width: 700px) {
  .footer-grid { grid-template-columns: 1fr; gap: 32px; }
  .footer-bottom { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<footer id="contato">
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <div class="footer-brand"><span>&lt;</span>JL<span>/&gt;</span></div>
        <div class="footer-desc">Desenvolvo sites, landing pages, e-commerces e sistemas sob medida. Cada projeto é pensado pra funcionar de verdade, não só parecer bonito.</div>
      </div>
      <div>
        <div class="footer-col-title">Contato</div>
        <div class="footer-links">
          <a href="#">(31) 98498-3061</a>
          <a href="#">contato@jeanlucasdev.com.br</a>
        </div>
      </div>
      <div>
        <div class="footer-col-title">Redes</div>
        <div class="footer-links">
          <a href="#">Instagram</a>
          <a href="#">LinkedIn</a>
          <a href="#">WhatsApp</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 JEAN LUCAS </span>
      <span>DESIGNED &amp; DEVELOPED BY <span>&lt;JL/&gt;</span></span>
    </div>
  </div>
</footer>

</body>
</html>
