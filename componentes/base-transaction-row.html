<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #050505;
  --bg-alt: #0a0a0a;
  --border: #111111;
  --border-alt: #1a1a1a;
  --accent: #0ea5e9;
  --accent-hover: #38bdf8;
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #666666;
  --text-dimmer: #444444;
  --text-faint: #333333;

  --amb-from: #0EA5E9;
  --amb-to: #0284C7;
  --amb-dot: #0a0a0a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }
.sora { font-family: 'Sora', sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 40px 24px; }
:root {
  --bg-base: #0a0a0a;
  --bg-surface: #111111;
  --bg-card: #1f1f1f;
  --border: #2a2a2a;
  --text: #fafafa;
  --text-muted: #a1a1aa;
  --accent: #0ea5e9;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;

  /* Uma cor por fonte de receita — a mesma em pílula, gráfico e avatar. */
  --src-empresa: #0ea5e9;
  --src-impressionart: #8b5cf6;
  --src-moto: #f59e0b;
  --src-mos: #22c55e;

  --fonte: 'Manrope', sans-serif;
  --fonte-titulo: 'Sora', sans-serif;
  --fonte-mono: 'JetBrains Mono', monospace;
}

body { background: var(--bg-base); color: var(--text); font-family: var(--fonte); }

/* Número em tabela, card ou badge nunca "dança" ao atualizar. */
.bs-num { font-variant-numeric: tabular-nums; }

.bs-rows { width: min(560px, 100%); display: flex; flex-direction: column; gap: 8px; }

.bs-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-surface);
}

.bs-row-av {
  display: grid; place-items: center; flex-shrink: 0;
  width: 36px; height: 36px; border-radius: 10px;
  background: color-mix(in srgb, var(--cor) 15%, transparent);
}
.bs-row-av span { width: 10px; height: 10px; border-radius: 999px; background: var(--cor); }

/* min-width: 0 é o que permite o truncamento: sem ele o flex item cresce
   até o texto caber e a linha estoura. */
.bs-row-txt { flex: 1; min-width: 0; }
.bs-row-desc {
  font-size: 13px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bs-row-leg {
  margin-top: 2px; font-size: 11px; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.bs-row-val {
  flex-shrink: 0;
  font-family: var(--fonte-titulo); font-size: 14px; font-weight: 600;
}
.bs-pos { color: var(--success); }
.bs-neg { color: var(--danger); }
</style>
</head>
<body>
<div class="bs-rows">
  <div class="bs-row">
    <div class="bs-row-av" style="--cor: var(--src-empresa)"><span></span></div>
    <div class="bs-row-txt">
      <div class="bs-row-desc">Site institucional — Clínica Vega</div>
      <div class="bs-row-leg">Empresa · Realizado</div>
    </div>
    <div class="bs-row-val bs-pos bs-num">+ R$ 4.800,00</div>
  </div>

  <div class="bs-row">
    <div class="bs-row-av" style="--cor: var(--src-impressionart)"><span></span></div>
    <div class="bs-row-txt">
      <div class="bs-row-desc">Remessa de setembro</div>
      <div class="bs-row-leg">Impressionart · Previsto</div>
    </div>
    <div class="bs-row-val bs-pos bs-num">+ R$ 1.260,00</div>
  </div>

  <div class="bs-row">
    <div class="bs-row-av" style="--cor: var(--src-moto)"><span></span></div>
    <div class="bs-row-txt">
      <div class="bs-row-desc">Combustível e manutenção</div>
      <div class="bs-row-leg">Moto · Realizado</div>
    </div>
    <div class="bs-row-val bs-neg bs-num">− R$ 380,00</div>
  </div>
</div>

</body>
</html>
